name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.asset_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset_arch: x64
            binary_arch: amd64
          - goarch: arm64
            asset_arch: arm64
            binary_arch: arm64
          - goarch: arm
            goarm: '7'
            asset_arch: armv7
            binary_arch: armv7
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compile stripped static binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -eu
          binary="sharewifi-linux-${{ matrix.binary_arch }}"
          go build -trimpath -buildvcs=false \
            -ldflags='-s -w -buildid=' \
            -o "$binary" main.go
          mkdir "package-${{ matrix.asset_arch }}"
          mv "$binary" "package-${{ matrix.asset_arch }}/sharewifi"
          tar -C "package-${{ matrix.asset_arch }}" -cJf \
            "sharewifi-${{ github.ref_name }}-linux-${{ matrix.asset_arch }}.tar.xz" \
            sharewifi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: sharewifi-linux-${{ matrix.asset_arch }}
          path: sharewifi-${{ github.ref_name }}-linux-${{ matrix.asset_arch }}.tar.xz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.xz > SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.xz
            release/SHA256SUMS
